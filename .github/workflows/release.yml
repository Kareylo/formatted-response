name: Release

# Only the `release` trigger: creating a GitHub Release with a new tag also
# fires `push: tags` in the same second, and two parallel runs race to
# `npm publish` — the loser fails with E409 since the registry is too slow
# to report the version for the guard below to catch it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs every third-party tool (eslint, vitest, tsdown, …) WITHOUT the OIDC
  # permission, and hands only the finished tarball to the publish job. A
  # compromised devDependency can therefore never mint a publish credential.
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.check-published.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache: npm`: the release must not restore a cache written by
      # other workflow runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      # A manual dispatch defaults to the default branch, where GITHUB_REF_NAME
      # is `master`, not a version — run it from a tag ("Use workflow from" →
      # Tags) to re-publish that version.
      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release must run from a tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'. For a manual run, pick the tag under \"Use workflow from\" → Tags."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Re-running the workflow (or a manual dispatch) for a version that is
      # already on npm would hard-fail at `npm publish`. Detect it here and skip
      # the publish job — the run still ends green.
      - name: Check whether this version is already published
        id: check-published
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if npm view "formatted-response@$PKG" version > /dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::formatted-response@$PKG is already published — the publish job will be skipped (likely a re-run)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm run test

      - name: Type-level tests
        run: npm run test:types

      - name: Build
        run: npm run build

      - name: Validate published package shape
        run: npm run check:package

      - name: Smoke-test the built output
        run: npm run test:dist

      # Everything past this point can no longer use `npm run <script>` — that's
      # the point. Consumers of the published package never install devDependencies
      # anyway (npm only installs a dependency's own `dependencies`, never its
      # `devDependencies`), but stripping both keeps the shipped package.json free
      # of internal tooling versions and test scripts.
      - name: Strip scripts and devDependencies from the published package.json
        run: npm pkg delete scripts devDependencies

      # Lists every file in the tarball in the log, then writes it to disk.
      - name: Pack the exact tarball to publish
        run: npm pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: formatted-response-*.tgz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    if: needs.build.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      # Trusted publishing: npm exchanges this job's OIDC token (`id-token: write`)
      # for a short-lived publish credential. No NPM_TOKEN secret. The trusted
      # publisher on npmjs.com must match repo, `release.yml` and `npm-publish`.
      # No checkout and no `npm ci`: nothing but npm itself runs in this job.
      - name: Publish
        run: npm publish ./formatted-response-*.tgz --provenance --access public
