name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Publishing a GitHub Release against a brand-new tag fires BOTH the `push`
      # tags trigger and this `release` trigger for the same version. Rather than
      # hard-failing the second run (a confusing red ❌ for a release that in fact
      # published fine), detect it here and skip every remaining step — the job
      # still ends green, just short-circuited.
      - name: Check whether this version is already published
        id: check-published
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if npm view "formatted-response@$PKG" version > /dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::formatted-response@$PKG is already published — skipping the rest of this run (likely the other of the push-tag/GitHub-Release trigger pair)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run typecheck

      - name: Full test suite
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run test

      - name: Type-level tests
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run test:types

      - name: Build
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run build

      - name: Validate published package shape
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run check:package

      - name: Smoke-test the built output
        if: steps.check-published.outputs.already_published != 'true'
        run: npm run test:dist

      # Everything past this point can no longer use `npm run <script>` — that's
      # the point. Consumers of the published package never install devDependencies
      # anyway (npm only installs a dependency's own `dependencies`, never its
      # `devDependencies`), but stripping both keeps the shipped package.json free
      # of internal tooling versions and test scripts.
      - name: Strip scripts and devDependencies from the published package.json
        if: steps.check-published.outputs.already_published != 'true'
        run: npm pkg delete scripts devDependencies

      - name: Inspect exactly what will be published
        if: steps.check-published.outputs.already_published != 'true'
        run: npm pack --dry-run

      - name: Publish
        if: steps.check-published.outputs.already_published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
